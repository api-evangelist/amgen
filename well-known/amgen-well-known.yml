specification: API Commons Well-Known
specificationVersion: '0.1'
provider: Amgen
providerId: amgen
generated: '2026-09-02'
method: probed
source: >-
  Live unauthenticated HTTP probes of the named /.well-known/ path list against every host
  reachable from apis.yml (www.amgen.com) plus the Amgen-operated secondary hosts found in
  the corporate sitemap. One attempt per URL, browser User-Agent, 10-15s ceiling.
description: >-
  Amgen serves no /.well-known/ discovery document on any host probed. The corporate origin
  (www.amgen.com) answers 403 from its edge for every path under /.well-known/ — an edge
  policy that blocks the dotted directory outright rather than a per-document decision — and
  404s for /llms.txt and /openapi.json. Two Amgen brand sites (amgenbiosimilars.com,
  amgenscience.com) answer 200 for EVERY path with a byte-identical single-page-app shell,
  which is a soft-404 and NOT a document. No WellKnown or SecurityTxt pointer is emitted:
  nothing returned a real document.
notes: >-
  No pointer emitted by design. Every row below is a recorded absence, which is valid
  measurement — it is what lets a later sweep show movement rather than starting over.
hosts:
  - host: www.amgen.com
    note: >-
      Corporate origin, the only host named in apis.yml. Edge returns 403 for the whole
      /.well-known/ directory; ordinary paths on the same host serve normally (robots.txt 200,
      sitemap.xml 200), so this is a blanket dotted-directory block, not a bot challenge.
    documents:
      - path: /.well-known/security.txt
